services:
  mysql:
    image: mysql:8.4
    container_name: imagen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: imagen
      MYSQL_USER: imagen
      MYSQL_PASSWORD: imagen
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "imagen", "-pimagen"]
      interval: 5s
      timeout: 3s
      retries: 20
